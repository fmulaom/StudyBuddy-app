name: CI with Code Coverage

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test with coverage
      run: >
        dotnet test
        --configuration Release
        --no-build
        --collect:"XPlat Code Coverage"
        --logger "console;verbosity=detailed"
        --results-directory="./TestResults"

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate Coverage Report
      run: >
        reportgenerator
        -reports:"./TestResults/**/coverage.cobertura.xml"
        -targetdir:"./coverage"
        -reporttypes:"Html;Json;JsonSummary"

    - name: Display Coverage Summary
      run: |
        echo ""
        echo "📊 Code Coverage Report:"
        echo "=========================="
        cat ./coverage/Summary.json | jq '.'

    - name: Extract and Display Coverage Percentage
      run: |
        if [ -f "./coverage/Summary.json" ]; then
          COVERAGE=$(cat ./coverage/Summary.json | jq -r '.linecoverage')
          echo ""
          echo "📈 Coverage Metrics:"
          echo "==================="
          echo "Line Coverage: ${COVERAGE}%"
          echo ""
          echo "Coverage Status:"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            echo "✅ PASS - Coverage is ${COVERAGE}% (threshold: 80%)"
            exit 0
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            echo "⚠️  WARNING - Coverage is ${COVERAGE}% (threshold: 80%)"
            exit 0
          else
            echo "❌ FAIL - Coverage is ${COVERAGE}% (threshold: 80%)"
            exit 1
          fi
        fi

    - name: Upload coverage reports to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        files: ./TestResults/**/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/
        retention-days: 30

    - name: Comment PR with Coverage
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = './coverage/Summary.json';
          
          if (fs.existsSync(path)) {
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const coverage = summary.linecoverage || 'N/A';
            
            const comment = `## 📊 Code Coverage Report
            
            **Line Coverage:** ${coverage}%
            
            📈 [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Coverage Summary:
            - Line Coverage: ${coverage}%
            - Branch Coverage: ${summary.branchcoverage || 'N/A'}%
            - Method Coverage: ${summary.methodcoverage || 'N/A'}%
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
