name: CI with Code Coverage

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test with coverage
      run: >
        dotnet test
        --configuration Release
        --no-build
        --collect:"XPlat Code Coverage"
        --logger "console;verbosity=detailed"
        --results-directory="./TestResults"

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate Coverage Report
      run: >
        reportgenerator
        -reports:"./TestResults/**/coverage.cobertura.xml"
        -targetdir:"./coverage"
        -reporttypes:"Html;JsonSummary"

    - name: Display Coverage Summary
      run: |
        echo ""
        echo "📊 Code Coverage Report:"
        echo "=========================="
        if [ -f "./coverage/Summary.json" ]; then
          cat ./coverage/Summary.json | jq '.'
        fi

    - name: Extract and Display Coverage Percentage
      run: |
        if [ -f "./coverage/Summary.json" ]; then
          COVERAGE=$(cat ./coverage/Summary.json | jq -r '.linecoverage')
          echo ""
          echo "📈 Coverage Metrics:"
          echo "==================="
          echo "Line Coverage: ${COVERAGE}%"
          echo ""
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            echo "✅ PASS - Coverage is ${COVERAGE}% (threshold: 80%)"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            echo "⚠️  WARNING - Coverage is ${COVERAGE}%"
          else
            echo "❌ FAIL - Coverage is ${COVERAGE}%"
          fi
        fi

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        files: ./TestResults/**/coverage.cobertura.xml
        fail_ci_if_error: false

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/
